version: '3.9'

services:
  db:
    image: mysql:8
    container_name: app-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: appdb
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppass
    ports:
      - '3307:3306'
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 5

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: appdb
      JWT_SECRET: secret-key
    ports:
      - '3001:3001'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  workout-service:
    build:
      context: ./workout-service
      dockerfile: Dockerfile
    container_name: workout-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: appdb
    ports:
      - '3002:3002'
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  plan-blog-service:
    build:
      context: ./plan-blog-service
      dockerfile: Dockerfile
    container_name: plan-blog-service
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: appuser
      DB_PASSWORD: apppass
      DB_NAME: appdb
      USER_SERVICE_URL: http://user-service:3001/users
      WORKOUT_SERVICE_URL: http://workout-service:3002/workouts
    ports:
      - '3003:3003'
    depends_on:
      db:
        condition: service_healthy
      user-service:
        condition: service_started
      workout-service:
        condition: service_started
    networks:
      - app-network

volumes:
  db_data:

networks:
  app-network:
    driver: bridge